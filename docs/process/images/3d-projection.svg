<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect width="640" height="340" fill="#f5f3ee"/>

  <!-- Left: assumed flat rotation -->
  <text x="150" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Assumed: flat sprite + pivot</text>
  <rect x="50" y="55" width="200" height="200" fill="#e8e4da" stroke="#999"/>
  <g transform="translate(150,155)">
    <circle r="4" fill="#333"/>
    <g transform="rotate(-20)">
      <rect x="-45" y="-25" width="90" height="50" fill="#8a9a5b" stroke="#4a5a2b" stroke-width="2"/>
    </g>
    <path d="M 0,0 A 55 55 0 0 1 38,-40" stroke="#c0392b" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
    <text x="46" y="-46" font-size="12" fill="#c0392b">rotate</text>
  </g>
  <text x="150" y="280" text-anchor="middle" font-size="12" fill="#666" font-style="italic">one 2D image, spun around a fixed point</text>

  <!-- Right: actual 3D projection -->
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Actual: projected 3D quad</text>
  <rect x="390" y="55" width="200" height="200" fill="#e8e4da" stroke="#999"/>

  <!-- 3D-ish corner points -->
  <g transform="translate(490,155)">
    <!-- ground plane hint -->
    <path d="M -70,50 L 70,50 L 40,-10 L -40,-10 Z" fill="none" stroke="#bbb" stroke-dasharray="3,3"/>
    <!-- object as skewed quad (perspective look) -->
    <polygon points="-50,20 45,10 35,-35 -35,-30" fill="#8a9a5b" stroke="#4a5a2b" stroke-width="2"/>
    <!-- corner dots -->
    <circle cx="-50" cy="20" r="4" fill="#c0392b"/>
    <circle cx="45" cy="10" r="4" fill="#c0392b"/>
    <circle cx="35" cy="-35" r="4" fill="#c0392b"/>
    <circle cx="-35" cy="-30" r="4" fill="#c0392b"/>
    <!-- camera / eye hint -->
    <circle cx="0" cy="90" r="5" fill="#333"/>
    <path d="M 0,90 L -50,20" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 0,90 L 45,10" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="0" y="108" text-anchor="middle" font-size="11" fill="#333">viewer</text>
  </g>
  <text x="490" y="280" text-anchor="middle" font-size="12" fill="#666" font-style="italic">4 local-space corners, one of 64 heading matrices,</text>
  <text x="490" y="296" text-anchor="middle" font-size="12" fill="#666" font-style="italic">then a shared 1/z perspective-divide table</text>

  <text x="320" y="325" text-anchor="middle" font-size="12" fill="#888">Schematic illustration of the technique -- not the original game art. See document 16.</text>
</svg>
