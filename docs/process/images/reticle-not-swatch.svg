<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect width="640" height="300" fill="#f5f3ee"/>

  <!-- Left panel: the guess -->
  <text x="150" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Guessed: a colour swatch</text>
  <rect x="60" y="55" width="180" height="180" fill="#e8e4da" stroke="#999" stroke-width="1"/>
  <rect x="90" y="85" width="120" height="120" fill="#7a6a52" stroke="#4a4030" stroke-width="2"/>
  <text x="150" y="150" text-anchor="middle" font-size="13" fill="#f0ece0">flat colour</text>
  <text x="150" y="250" text-anchor="middle" font-size="12" fill="#666" font-style="italic">4 cels, own embedded palette,</text>
  <text x="150" y="266" text-anchor="middle" font-size="12" fill="#666" font-style="italic">assumed = unused team-colour reference</text>

  <!-- Arrow -->
  <path d="M 260 145 L 360 145" stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="130" text-anchor="middle" font-size="13" fill="#333">rendered it</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Right panel: the actual render -->
  <text x="490" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Actual: a target-lock reticle</text>
  <rect x="400" y="55" width="180" height="180" fill="#e8e4da" stroke="#999" stroke-width="1"/>
  <g transform="translate(490,145)">
    <circle r="80" fill="#6b4c7a"/>
    <circle r="60" fill="#1a1a1a"/>
    <circle r="38" fill="#d9c94a"/>
    <circle r="18" fill="#c0392b"/>
  </g>
  <text x="490" y="250" text-anchor="middle" font-size="12" fill="#666" font-style="italic">concentric rings, one colour swaps per cel</text>
  <text x="490" y="266" text-anchor="middle" font-size="12" fill="#666" font-style="italic">(red / blue / purple-red / blue-black)</text>

  <text x="320" y="292" text-anchor="middle" font-size="12" fill="#888">Schematic redraw for illustration -- not the original game art. See document 13.</text>
</svg>
