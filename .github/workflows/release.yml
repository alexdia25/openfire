# Builds the Windows and Linux "Open Fire" exports and publishes them as a GitHub release.
#
#   git tag v0.1.0 && git push origin v0.1.0     -> release is created (as a draft, so you can review it)
#   Actions > Release > Run workflow             -> builds only; archives are downloadable from the run
#
# The engine is a public submodule (relative URL), so the default token can check it out.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2-stable   # keep in step with config/features in project.godot

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Godot and export templates
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q godot.zip
          dir=$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}
          mkdir -p "$dir" templates_tmp
          unzip -q templates.tpz -d templates_tmp
          mv templates_tmp/templates/* "$dir"/
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Export and package
        run: bash tools/package_release.sh "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenFire-${{ github.ref_name }}
          path: dist/*

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes \
            --title "Open Fire $GITHUB_REF_NAME"
